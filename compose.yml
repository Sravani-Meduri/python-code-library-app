---
services:
  db:
    image: sravanif5/flm-oct:db
    deploy:
      replicas: 1
    ports:
      - "3306:3306"
    networks:
      - mynetwork

  auth_service:
    image: sravanif5/flm-oct:pythonappauth
    deploy:
      replicas: 2
    ports:
      - "5001:5001"
    networks:
      - mynetwork
    depends_on:
      - db
    

  book_service:
    image: sravanif5/flm-oct:pythonappbook
    deploy:
      replicas: 2
    ports:
      - "5002:5002"
    networks:
      - mynetwork
    depends_on:
      - db
  borrow_service:
    image: sravanif5/flm-oct:pythonappborrow
    deploy:
      replicas: 2
    ports:
      - "5003:5003"
    networks:
      - mynetwork
    depends_on:
      - db

  frontend:
    image: sravanif5/flm-oct:pythonappfrontned
    deploy:
      replicas: 2
    ports:
      - "5000:5000"
    networks:
      - mynetwork
    depends_on:
      - auth_service
      - book_service
      - borrow_service

networks:
  mynetwork:
    driver: bridge
